global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: restreamer
    metrics_path: /metrics
    # Credentials are written to these files from BASIC_AUTH_USER / BASIC_AUTH_PASS
    # at container start (see docker-compose.monitoring.yml).
    basic_auth:
      username_file: /prometheus/restreamer-user
      password_file: /prometheus/restreamer-pass
    static_configs:
      - targets: ["restreamer:6070"]
